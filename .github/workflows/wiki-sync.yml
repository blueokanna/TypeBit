name: sync-wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: mirror docs/wiki → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the wiki repository
        run: |
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}

      - name: Mirror docs/wiki into the wiki clone
        working-directory: wiki
        run: |
          # keep only the wiki's .git directory, drop everything else
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R ../docs/wiki/. .

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no wiki changes"
          else
            git commit -m "sync wiki from docs/wiki"
            git push
          fi
