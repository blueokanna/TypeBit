name: sync-wiki

# Publish the in-repo docs/wiki/ directory to the GitHub wiki.
#
# The wiki is a separate git repo (<owner>/<repo>.wiki). This workflow
# checks it out, replaces every tracked markdown page with the content of
# docs/wiki/ from main, and pushes.
#
# `git rm -r '*.md'` first, so renames and deletions in docs/wiki/ propagate
# instead of leaving stale pages behind.
#
# Push auth: the automatic GITHUB_TOKEN can write to the wiki as long as
# `contents: write` is granted (it is below). If your fork/org blocks
# that, create a fine-grained PAT with "Read and write" access to the
# wiki and store it as the GH_PAT secret — the token expression falls
# back to it automatically.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Publish wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Sync wiki content
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop every tracked markdown page so renames/deletions propagate.
          git rm -r --quiet --ignore-unmatch '*.md' || true
          # Mirror docs/wiki/ into the wiki root (Home.md = landing page;
          # the en/zh pages live at the root with distinct file names).
          cp -R ../repo/docs/wiki/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes; nothing to push"
            exit 0
          fi
          git commit -m "Publish wiki from main (${{ github.sha }})"
          git push
