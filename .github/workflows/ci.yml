name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Native: formatting, clippy (all features, all targets), tests.
  check:
    name: check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (no_std)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Clippy (std)
        run: cargo clippy --all-targets --features std -- -D warnings

      - name: Clippy (std + ffi)
        run: cargo clippy --all-targets --features std,ffi -- -D warnings

      - name: Test
        run: cargo test --all-features
  no_std:
    name: no_std (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none

      - name: Check bare-metal no_std build
        run: cargo check --target aarch64-unknown-none --no-default-features

  # MSRV as declared in Cargo.toml (1.89, required by courierust 1.0.2).
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check on MSRV
        run: cargo check --features std

  ffi:
    name: ffi bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build with ffi
        run: cargo build --features ffi

      - name: FFI integration (extern C calls the exported symbols)
        run: cargo run --example ffi_demo --features ffi
