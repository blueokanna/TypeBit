[package]
name = "typebit"
version = "0.1.9"
edition = "2021"
rust-version = "1.95"
license-file = "LICENSE"
authors = ["blueokanna, HyphenTeam"]
description = "A no_std BitTorrent v1/v2 engine core (DHT, PEX, LSD, uTP, web seeds, trackers, SOCKS5) with provable-download receipts and a semantic utility scheduler; unified link parser for eD2k/Xunlei/IPFS/Kad/netdisk (parsing only)."
homepage = "https://github.com/blueokanna/TypeBit"
repository = "https://github.com/blueokanna/TypeBit"
documentation = "https://docs.rs/typebit"
readme = "README.md"
keywords = ["bittorrent", "p2p", "dht", "ed2k", "torrent"]
categories = [
    "network-programming",
    "cryptography",
    "web-programming::http-client",
]
include = ["src/**", "README.md", "LICENSE", "docs/**", "examples/**"]

[lib]
name = "typebit"
path = "src/lib.rs"

[dependencies]
nextjson = { version = "0.1", default-features = false, features = ["derive"] }
rustbinary = { version = "0.1.7", default-features = false, features = [
    "alloc",
] }
tzcraft = { version = "0.1", default-features = false }
courierust = { version = "1.0", default-features = false }
socket2 = { version = "0.6.5", optional = true }

[features]
default = []
std = ["nextjson/std", "tzcraft/std", "courierust/std", "socket2"]
ffi = ["std"]

[[example]]
name = "ffi_demo"
required-features = ["ffi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
